# Blueprint: https://render.com/docs/blueprint-spec
#
# Stripe (Render → Environment). Use two underscores, not a colon.
#   Stripe__SecretKey        or   STRIPE_SECRET_KEY        → sk_test_… or sk_live_…
#   Stripe__PublishableKey   or   STRIPE_PUBLISHABLE_KEY   → pk_test_… or pk_live_… (same mode)
# Optional Docker-style file path: STRIPE_SECRET_KEY_FILE=/run/secrets/stripe_secret
# Cutover to client account: replace both keys with the client's (test first, then live),
# save, Manual Deploy, smoke-test checkout; no webhook secret needed for this app.
#
# Persist catalog across redeploys (free): create a Turso database, then set:
#   TURSO_DATABASE_URL   e.g. libsql://your-db-org.turso.io
#   TURSO_AUTH_TOKEN     database auth token from Turso
# Without these, the app uses ephemeral local SQLite (lost on redeploy).
#
# Admin login (defaults exist in appsettings; override in production):
#   Admin__Username   or   ADMIN_USERNAME
#   Admin__Password   or   ADMIN_PASSWORD
#
# TikTok footer auto-sync (RapidAPI tiktok-scraper7):
#   TikTokFeed__Username      or   TIKTOK_FEED_USERNAME     (handle without @)
#   TikTokFeed__RapidApiKey   or   TIKTOK_FEED_RAPIDAPI_KEY or RAPIDAPI_KEY
# Use two underscores (__) between TikTokFeed and RapidApiKey — not a colon.
#
# RENDER_EXTERNAL_URL is set by Render and used for Stripe success/cancel links.
# Optional override: App__PublicBaseUrl=https://your-service.onrender.com
services:
  - type: web
    name: fantasybooks
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
